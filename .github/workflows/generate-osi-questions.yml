name: Generar preguntas OSI (Groq)

on:
  schedule:
    - cron: '0 6 * * *'   # todos los días a las 06:00 UTC (~08:00 hora España en verano)
  workflow_dispatch:        # permite lanzarlo a mano desde la pestaña "Actions" en GitHub

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generar preguntas con Groq
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/generate-osi-questions.mjs

      - name: Commitear si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add questions/osi-quiz.json
          git diff --cached --quiet || git commit -m "chore: preguntas OSI generadas automáticamente"
          git push
